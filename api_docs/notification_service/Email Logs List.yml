info:
  name: Email Logs List
  type: http
  seq: 1
  tags:
    - Email Log

http:
  method: GET
  url: "{{url}}/email_logs/"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{url}}/email_logs/"
      method: GET
      params:
        - name: notification_id
          value: ""
          type: query
        - name: limit
          value: "10"
          type: query
        - name: offset
          value: "0"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{url}}/email_logs/"
      method: GET
      params:
        - name: notification_id
          value: ""
          type: query
        - name: limit
          value: "10"
          type: query
        - name: offset
          value: "0"
          type: query
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
