  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/events/"
  params:
    - name: service
      value: ""
      type: query
      description: The service that generated the events
      disabled: true
    - name: actor_id
      value: ""
      type: query
      description: The user ID associated with the events
      disabled: true
    - name: date
      value: ""
      type: query
      description: "The date range for the events starting from input data till current date (format: YYYY-MM-DD)"
      disabled: true
