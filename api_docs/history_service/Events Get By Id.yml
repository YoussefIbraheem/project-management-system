info:
  name: Events Get By Id
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/events/:event_id"
  params:
    - name: event_id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

