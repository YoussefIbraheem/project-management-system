info:
  name: password-reset_reset
  type: http
  seq: 3
  tags:
    - password-reset

http:
  method: POST
  url: "{{url}}/password-reset/"
  body:
    type: json
    data: |-
      {
        "email": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Sends a signal reset_password_token_created when a reset token was created
