info:
  name: password-reset_confirm
  type: http
  seq: 1
  tags:
    - password-reset

http:
  method: POST
  url: "{{url}}/password-reset/confirm/"
  body:
    type: json
    data: |-
      {
        "password": "",
        "token": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: An Api View which provides a method to reset a password based on a unique token
