services:
  # Services
  # Django Users Service
  users-service:
    image: project_management_system_django
    build:
      context: ./services/users
      dockerfile: Dockerfile
    command: bash -c "
      python manage.py migrate
      && python manage.py runserver 0.0.0.0:8000
      "
    container_name: users_service
    ports:
      - "8000:8000"
    volumes:
      - ./services/users:/accounts
    working_dir: /accounts
    env_file:
      - ./services/users/.env
    depends_on:
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  # Flask Tasks Service
  tasks-service:
    build:
      context: ./services/tasks
      dockerfile: Dockerfile
    container_name: tasks_service
    ports:
      - "5005:5005"
    env_file:
      - ./services/tasks/.env
    volumes:
      - ./services/tasks:/app
    depends_on:
      postgresdb:
        condition: service_healthy
        
  # FastAPI History Service
  history-service:
    build:
      context: ./services/history
      dockerfile: Dockerfile
    container_name: history_service
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5006:5006"
    volumes:
      - ./services/history:/app
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user
      - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - db:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "user",
          "-p",
          "pass",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.runCommand({ ping: 1 })",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # FastAPI Notification Service
  notifications-service:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: notifications_service
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8081:8081"
    volumes:
      - ./services/notifications:/app
    env_file:
      - ./services/notifications/.env
    depends_on:
      redis:
        condition: service_started
      postgresdb:
        condition: service_started
  # DBs
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql # ← Create databases on startup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine
    container_name: redis_service
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  # MISC
  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: rabbitmq_service
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro

  history-worker:
    build:
      context: ./services/history
      dockerfile: Dockerfile
    container_name: history_worker
    command: python app/consumers/history_consumer.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/history:/app
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  notifications-worker:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: notification_worker
    command: python app/consumers/notifications_consumer.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/notifications:/app
    depends_on:
      postgresdb:
        condition: service_started
      rabbitmq:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  db:
  configdb:
  mongot:
