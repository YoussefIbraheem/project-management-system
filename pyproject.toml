[tool.basedpyright]
typeCheckingMode = "basic"

reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportMissingTypeArgument = "none"
reportAny = "none"

pythonVersion = "3.14"
pythonPlatform = "Linux"

extraPaths = [
    "services/users",
    "services/tasks",
    "services/history",
    "services/notifications",
]